name: CI

# Runs on every PR into main, and on main itself so the branch always has a
# recent green (or red) result rather than only being verified at review time.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cheapest possible gate: reject a branch whose name does not carry one
      # of the house prefixes before spending a runner on install + build.
      # PRs only — a push to main has no head_ref and main is not prefixed.
      # The name comes in through env, not `${{ }}` interpolation, so a branch
      # named with shell metacharacters cannot inject into this script.
      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            feat/?*|fix/?*|chore/?*|refactor/?*|exp/?*) ;;
            *)
              echo "::error::Branch '$HEAD_REF' must start with feat/ fix/ chore/ refactor/ or exp/"
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `next build` runs `prebuild` (scripts/audit-style-usage.mjs) first.
      # No secrets needed: every public page tolerates an unreachable database
      # and renders empty, so the build completes with no Supabase env vars at
      # all. Verified against a clean checkout with no .env.local.
      - name: Build
        run: npm run build
